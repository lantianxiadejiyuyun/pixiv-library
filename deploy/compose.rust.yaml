# Run with: docker compose --project-directory . --env-file deploy/.env -f deploy/compose.rust.yaml ...
# Uses a separate Compose project and database volume for validation by default.
name: qiye-library-rust
x-native: &native
  image: qiye-library-rust:0.1.0
  build:
    context: .
    dockerfile: deploy/Dockerfile.rust
  environment: &environment
    LIBRARY_ENV: production
    LIBRARY_DATABASE_URL: mysql://library:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@db:3306/library
    LIBRARY_ADMIN_PASSWORD: ${LIBRARY_ADMIN_PASSWORD:?Set LIBRARY_ADMIN_PASSWORD}
    LIBRARY_SECRET_KEY: ${LIBRARY_SECRET_KEY:?Preserve the existing library encryption key when migrating}
    LIBRARY_STORAGE_ROOT: /library/data
    LIBRARY_IMPORT_ROOT: /library/imports
    LIBRARY_STORAGE_REQUIRE_MARKER: "true"
    LIBRARY_ALLOWED_ORIGINS: ${LIBRARY_ALLOWED_ORIGINS:-}
    LIBRARY_SECURE_COOKIE: ${LIBRARY_SECURE_COOKIE:-false}
    LIBRARY_RUST_READ_ONLY: ${LIBRARY_RUST_READ_ONLY:-true}
    LIBRARY_RUST_WORKERS_ENABLED: ${LIBRARY_RUST_WORKERS_ENABLED:-false}
    LIBRARY_CPU_AFFINITY: ${LIBRARY_CPU_AFFINITY:-auto}
    LIBRARY_MIHOMO_PROXY_PORT: ${LIBRARY_MIHOMO_PROXY_PORT:-17890}
    LIBRARY_MIHOMO_CONTROLLER_PORT: ${LIBRARY_MIHOMO_CONTROLLER_PORT:-19090}
    LIBRARY_AI_VISION_URL: ${LIBRARY_AI_VISION_URL:-}
    LIBRARY_AI_VISION_KEY: ${LIBRARY_AI_VISION_KEY:-}
  volumes:
    - ${LIBRARY_DATA_PATH:?Set the mounted NAS library path}:/library/data
    - ${LIBRARY_IMPORT_PATH:-./imports}:/library/imports:ro
  depends_on:
    db:
      condition: service_healthy
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  extra_hosts: ["host.docker.internal:host-gateway"]
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: library
      MYSQL_USER: library
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [rust_mysql:/var/lib/mysql]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u library -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
  migrate:
    <<: *native
    profiles: [initialize]
    command: [migrate]
    environment:
      <<: *environment
      LIBRARY_RUST_READ_ONLY: "false"
      LIBRARY_RUST_WORKERS_ENABLED: "false"
    healthcheck:
      disable: true
  app:
    <<: *native
    restart: unless-stopped
    stop_grace_period: 25s
    ports: ["${LIBRARY_RUST_PORT:-8801}:8000"]
volumes:
  rust_mysql:
